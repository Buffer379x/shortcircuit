[package]
name = "shortcircuit"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json"] }
url = "2.5.9"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = "symbols"
