name: Core checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  SHORTCIRCUIT_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm run check --prefix frontend
      - run: node tests/url-cleaner.cjs
      - run: npm run build --prefix frontend
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - run: cargo test --locked --all-targets
      - run: python3 tests/openapi.py
      - run: python3 tests/unraid_template.py
      - run: python3 tests/schema.py
        if: always()
      - run: python3 tests/analytics_schema.py
        if: always()
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
        if: always()
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo install cargo-deny --version 0.22.1 --locked
      - run: cargo deny --locked check advisories licenses sources
      - run: npm audit --audit-level=high --prefix frontend
        if: always()
  container:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - id: runtime
        run: docker compose up --build --detach --wait --wait-timeout 90
      - name: Check listener separation and non-root execution
        run: |
          image=$(docker compose config --images)
          test "$image" = "shortcircuit:$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')"
          curl --fail --silent http://127.0.0.1:8081/readyz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/readyz)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Host: localhost:8081' http://127.0.0.1:8081/api/v1/links)" = "401"
          test "$(docker inspect --format '{{.Config.User}}' "$(docker compose ps -q shortcircuit)")" = "10001:10001"
          docker compose exec -T shortcircuit shortcircuit --version | grep -F "($SHORTCIRCUIT_BUILD_REVISION)"
      - name: Exercise authenticated workflows and accessibility in Chromium
        run: |
          browser_deps="$RUNNER_TEMP/shortcircuit-browser"
          npm install --prefix "$browser_deps" --no-save --no-audit --no-fund playwright@1.65.0 axe-core@4.14.1
          # GitHub's Ubuntu runners already include Chromium's system libraries.
          "$browser_deps/node_modules/.bin/playwright" install --only-shell chromium
          setup_token=$(docker compose exec -T shortcircuit shortcircuit setup-token)
          printf '::add-mask::%s\n' "$setup_token"
          SHORTCIRCUIT_SETUP_TOKEN="$setup_token" SHORTCIRCUIT_PLAYWRIGHT="$browser_deps/node_modules/playwright" \
            SHORTCIRCUIT_AXE_CORE="$browser_deps/node_modules/axe-core" SHORTCIRCUIT_ARTIFACTS="$RUNNER_TEMP/browser-failure" \
            node tests/admin-browser.cjs
      - name: Keep browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-screenshots
          path: ${{ runner.temp }}/browser-failure
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise backup and offline restore
        id: smoke
        run: |
          snapshot=$(docker compose exec -T shortcircuit shortcircuit backup)
          case "$snapshot" in /data/backups/shortcircuit-*.sqlite) ;; *) exit 1 ;; esac
          if docker compose exec -T shortcircuit shortcircuit restore "$snapshot" --confirm; then
            exit 1
          fi
          docker compose stop shortcircuit
          docker compose run --rm --no-deps -T shortcircuit restore "$snapshot" --confirm
          docker compose up --detach --wait --wait-timeout 90
          test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' http://localhost:8080/backup-check)" = "https://example.test/backup-check"
      - name: Upgrade a disposable volume from the installed preview
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          previous=ghcr.io/buffer379x/shortcircuit:0.8.0-preview.3@sha256:5e023edc6245ef520b1e42bab8de6b275a53343a2ca0d30f77622b7caa58395d
          candidate=$(docker compose config --images)
          docker pull "$previous"
          docker image inspect "$previous" --format '{{range .RepoDigests}}{{println .}}{{end}}'
          docker compose stop
          volume=shortcircuit-testing-upgrade
          name=shortcircuit-testing-upgrade
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          start_upgrade_service() {
            start_ms=$(date +%s%3N)
            docker run --detach --name "$name" --pull=never --read-only \
              --security-opt=no-new-privileges=true --cap-drop=ALL \
              --publish=127.0.0.1:8080:8080 --publish=127.0.0.1:8081:8081 \
              --volume="$volume:/data" "$1"
            curl --retry 30 --retry-all-errors --retry-delay 1 --max-time 5 --fail --silent --show-error \
              http://127.0.0.1:8081/readyz
            echo "Ready after $(( $(date +%s%3N) - start_ms )) ms"
          }
          start_upgrade_service "$previous"
          setup_token=$(docker exec "$name" shortcircuit setup-token)
          printf '::add-mask::%s\n' "$setup_token"
          UPGRADE_SETUP_TOKEN="$setup_token" python3 tests/preview_upgrade.py seed
          docker exec "$name" shortcircuit backup >/dev/null
          docker stop "$name"
          docker rm "$name"
          start_upgrade_service "$candidate"
          python3 tests/preview_upgrade.py verify
          docker stop "$name"
          docker rm "$name"
          docker compose up --detach --wait --wait-timeout 90
      - name: Record the local image size
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        id: image
        run: |
          image=$(docker compose config --images)
          printf 'ref=%s\n' "$image" >> "$GITHUB_OUTPUT"
          docker image inspect "$image" --format 'Image bytes {{.Size}}'
      - name: Scan the candidate container
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          version: v0.76.2
          scanners: vuln
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
      # Release review also needs unfixed findings, which do not fail the build.
      - name: Report unfixed high and critical findings for review
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          version: v0.76.2
          scanners: vuln
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: false
          format: table
      - name: Generate the candidate SBOM
        id: sbom
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          version: v0.76.2
          format: cyclonedx
          output: shortcircuit-sbom.cdx.json
      - name: Keep the SBOM for release review
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shortcircuit-candidate-sbom
          path: shortcircuit-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Measure loopback redirect latency
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: |
          uname -m
          getconf _NPROCESSORS_ONLN
          python3 tests/redirect_benchmark.py --base-url http://localhost:8080 --slug backup-check --warmup 64 --requests 1024 --concurrency 8
          docker stats --no-stream --format '{{.MemUsage}}' "$(docker compose ps -q shortcircuit)"
      # The read-only image needs a writable SQLite temp directory for batched analytics writes.
      - name: Check that the burst was recorded without analytics losses
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: |
          sleep 2
          # Queue overflow under a burst is bounded by design; failed writes are a defect.
          if docker compose logs shortcircuit | grep -E '"write_failures":[1-9]'; then
            exit 1
          fi
      - if: always()
        run: docker compose down --volumes
