name: Container preview

on:
  workflow_run:
    workflows: [Core checks]
    branches: [main]
    types: [completed]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: shortcircuit-container-preview
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERSION: 0.9.0-preview.1
      # The published 0.8.0-preview.3 image that current installations run.
      PREVIOUS_IMAGE: ghcr.io/buffer379x/shortcircuit@sha256:5e023edc6245ef520b1e42bab8de6b275a53343a2ca0d30f77622b7caa58395d
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Select the preview version from the template
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(python3 -c 'from xml.etree import ElementTree; print(ElementTree.parse("unraid/shortcircuit.xml").findtext("Repository"))')
          if [[ "$image" != "ghcr.io/buffer379x/shortcircuit:$VERSION" ]]; then
            echo "The Unraid template does not match the approved preview image." >&2
            exit 1
          fi
          if gh api --silent "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" 2> "$RUNNER_TEMP/release-check"; then
            echo "v$VERSION has already been released."
            exit 0
          fi
          if ! grep -Fq '(HTTP 404)' "$RUNNER_TEMP/release-check"; then
            cat "$RUNNER_TEMP/release-check" >&2
            exit 1
          fi
          printf 'image=%s\nversion=%s\n' "$image" "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build the amd64 image and start it with the Unraid template defaults
        if: steps.version.outputs.image != ''
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          docker build --platform linux/amd64 --tag "$IMAGE" \
            --build-arg "SHORTCIRCUIT_BUILD_REVISION=$RELEASE_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" .
          args=$(python3 -c '
          import shlex
          from xml.etree import ElementTree
          template = ElementTree.parse("unraid/shortcircuit.xml")
          for arg in shlex.split(template.findtext("ExtraParams")):
              print(arg)
          for config in template.findall("./Config[@Type=\"Variable\"]"):
              print("--env={}={}".format(config.attrib["Target"], config.text or ""))
          ')
          mapfile -t template_args <<< "$args"
          trap 'docker rm -f shortcircuit-template >/dev/null; docker volume rm shortcircuit-data >/dev/null' EXIT
          docker run --detach --name shortcircuit-template --pull=never --network bridge "${template_args[@]}" "$IMAGE"
          curl --retry 30 --retry-all-errors --retry-delay 1 --max-time 5 --fail --silent --show-error http://127.0.0.1:8081/readyz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/readyz)" = "404"
          test "$(docker inspect --format '{{.Config.User}}' shortcircuit-template)" = '10001:10001'
          docker exec shortcircuit-template test -f /data/shortcircuit.db
          docker exec shortcircuit-template test -s /usr/share/doc/shortcircuit/LICENSE
          test "$(docker exec shortcircuit-template shortcircuit --version)" = "shortcircuit $VERSION ($RELEASE_SHA)"
          docker exec shortcircuit-template shortcircuit setup-token >/dev/null
          curl --fail --silent --show-error http://localhost:8081/favicon.png --output "$RUNNER_TEMP/favicon.png"
          cmp "$RUNNER_TEMP/favicon.png" assets/branding/favicon.png
      - name: Upgrade a disposable volume from 0.8.0-preview.3
        if: steps.version.outputs.image != ''
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          set -euo pipefail
          container=shortcircuit-preview-upgrade
          volume=shortcircuit-preview-upgrade
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          docker pull --platform linux/amd64 "$PREVIOUS_IMAGE"
          start_upgrade_test() {
            docker run --detach --name "$container" --pull=never --read-only \
              --cap-drop=ALL --security-opt=no-new-privileges=true \
              --publish=127.0.0.1:8080:8080 --publish=127.0.0.1:8081:8081 \
              --volume="$volume:/data" "$1"
            curl --retry 30 --retry-all-errors --retry-delay 1 --max-time 5 --fail --silent --show-error \
              http://127.0.0.1:8081/readyz
          }
          start_upgrade_test "$PREVIOUS_IMAGE"
          setup_token=$(docker exec "$container" shortcircuit setup-token)
          printf '::add-mask::%s\n' "$setup_token"
          UPGRADE_SETUP_TOKEN="$setup_token" python3 tests/preview_upgrade.py seed
          docker exec "$container" shortcircuit backup >/dev/null
          docker stop "$container"
          docker rm "$container"
          start_upgrade_test "$IMAGE"
          python3 tests/preview_upgrade.py verify
      - name: Upload the image to GitHub Container Registry
        if: steps.version.outputs.image != ''
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE" | tee "$RUNNER_TEMP/image-push.log"
          digest=$(sed -nE 's/^.*: digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\1/p' "$RUNNER_TEMP/image-push.log")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image=%s\ndigest=%s\n' "$IMAGE" "$digest" >> "$GITHUB_OUTPUT"

  public-pull:
    needs: publish
    if: needs.publish.outputs.image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Verify the published image without credentials
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          docker pull --platform linux/amd64 "$IMAGE"
          docker image inspect "$IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}' |
            grep -Fx "${IMAGE%:*}@$DIGEST"

  # The scanner runs without any write permission. The release job only downloads its output.
  sbom:
    needs: [publish, public-pull]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Name the published image by digest
        id: pinned
        run: printf 'ref=%s@%s\n' "${IMAGE%:*}" "$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Generate the SBOM for the published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.pinned.outputs.ref }}
          version: v0.76.2
          format: cyclonedx
          output: shortcircuit-sbom.cdx.json
      - name: Copy the frontend SBOM from the image
        env:
          PINNED: ${{ steps.pinned.outputs.ref }}
        run: |
          container=$(docker create "$PINNED")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/share/doc/shortcircuit/frontend-sbom.cdx.json" frontend-sbom.cdx.json
          printf '%s\n' "$PINNED" > image-digest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: |
            shortcircuit-sbom.cdx.json
            frontend-sbom.cdx.json
            image-digest.txt
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [publish, public-pull, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      VERSION: ${{ needs.publish.outputs.version }}
      IMAGE: ${{ needs.publish.outputs.image }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: ${{ runner.temp }}/release-sbom
      - name: Publish the GitHub prerelease and Unraid template
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf 'Development preview for Unraid Docker Manager on linux/amd64.\n\n'
            printf -- '- Image `%s`\n- Digest `%s@%s`\n' "$IMAGE" "${IMAGE%:*}" "$DIGEST"
            printf '\n## Changes\n'
            awk -v heading="## $VERSION" '$0 == heading { release = 1; next } release && /^## / { exit } release { print }' CHANGELOG.md
            printf '[Installation and upgrade](https://github.com/%s/blob/v%s/docs/UNRAID_INSTALLATION.md)\n' "$GITHUB_REPOSITORY" "$VERSION"
          } > "$notes"
          cp unraid/shortcircuit.xml "$RUNNER_TEMP/my-shortcircuit.xml"
          sboms="$RUNNER_TEMP/release-sbom"
          grep -Fx "${IMAGE%:*}@$DIGEST" "$sboms/image-digest.txt"
          test -s "$sboms/shortcircuit-sbom.cdx.json"
          test -s "$sboms/frontend-sbom.cdx.json"
          gh release create "v$VERSION" "$RUNNER_TEMP/my-shortcircuit.xml" \
            "$sboms/image-digest.txt" "$sboms/shortcircuit-sbom.cdx.json" \
            "$sboms/frontend-sbom.cdx.json" \
            --target "$RELEASE_SHA" --prerelease --latest=false \
            --title "ShortCircuit $VERSION" --notes-file "$notes"
