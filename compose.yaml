services:
  shortcircuit:
    image: shortcircuit:0.6.0-preview.2
    build:
      context: .
      args:
        SHORTCIRCUIT_BUILD_REVISION: ${SHORTCIRCUIT_BUILD_REVISION:-}
    pull_policy: build
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    environment:
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-0}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - shortcircuit-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 25s
    restart: unless-stopped

volumes:
  shortcircuit-data:
